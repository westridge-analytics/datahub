// Helpers
const fmt = (n, dp = 1) => {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n), sign = n < 0 ? '−' : '';
  if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(dp)}B`;
  if (abs >= 1)    return `${sign}$${abs.toFixed(dp)}M`;
  return `${sign}$${(abs * 1000).toFixed(0)}K`;
};

    link:    { background:'transparent', border:`1px solid ${C.accentBdr}`, color: C.accent },

};

// Synthetic financials for other orgs
const ALL_FIN = { '13-5562394': MET_FIN };
ORGS.forEach(o => {
  if (o.ein === '13-5562394') return;
  ALL_FIN[o.ein] = {};
  const base = 60 + ((o.ein.charCodeAt(3) * 7) % 280);
  [2019,2020,2021,2022,2023].forEach((y, i) => {
    const rev = base * (1 + i * 0.04) * (0.88 + Math.sin(i * 1.3) * 0.14);
    const exp = rev * (0.92 + Math.sin(i * 0.8) * 0.06);
    ALL_FIN[o.ein][y] = {
      totalRevenue: rev, totalExpenses: exp, netIncome: rev - exp,
      totalAssets: base * 14 * (1.03 ** i), totalLiab: base * 2.2, totalNA: base * 11.8 * (1.02 ** i),
      uc1: rev * 0.38, uc2: rev * 0.48, uc3: rev * 0.58, ok: y !== 2021 || i % 3 !== 0,
    };
  });
});

const DEFAULT_COL_KEYS = new Set(['ein','name','year','sector','state','cohort','totalRevenue','totalExpenses','netIncome','totalAssets','totalNA']);


const MainData = ({ onDrill }) => {
  const [sortKey, setSort]     = useState('name');
  const [sortDir, setDir]      = useState('asc');
  const [search, setSearch]    = useState('');
  const [chips, setChips]      = useState([{ id:'yr', label:'Year: 2019–2023' }, { id:'sec', label:'Sector: Arts, Higher Ed' }]);
  const [sel, setSel]          = useState(new Set());
  const [visCols, setVisCols]  = useState(new Set(DEFAULT_COL_KEYS));
  const [showColPicker, setShowColPicker] = useState(false);
  const COLS = ALL_COLS.filter(c => visCols.has(c.key));

  const rows = TABLE_ROWS
    .filter(r => !search || r.name.toLowerCase().includes(search.toLowerCase()) || r.ein.includes(search))
    .sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return typeof av === 'number'
        ? sortDir === 'asc' ? av - bv : bv - av
        : sortDir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    });

const BoxWhiskerChart = ({ cohorts, selected, onSelect }) => {
  const yMin = 0, yMax = 92;
  const CH = 190, CW = 480, PL = 42, PR = 16, PT = 10, PB = 44;
  const iH = CH - PT - PB, iW = CW - PL - PR;
  const yS = v => PT + iH - ((v - yMin) / (yMax - yMin)) * iH;
  const xS = i => PL + (i + 0.5) * (iW / cohorts.length);
  const bW = 38;
  return (
    <svg width="100%" viewBox={`0 0 ${CW} ${CH}`} style={{ display:'block', overflow:'visible' }}>
      {[0,20,40,60,80].map(t => (
        <g key={t}>
          <line x1={PL} y1={yS(t)} x2={CW-PR} y2={yS(t)} stroke="#E4EEF3" strokeWidth="1" />
          <text x={PL-4} y={yS(t)+3.5} fontSize="9" fill="#9A9890" textAnchor="end">{t}%</text>
        </g>
      ))}
      {cohorts.map((c, i) => {
        const x = xS(i), isSel = selected?.label === c.label;
        const op = selected && !isSel ? 0.3 : 1;
        return (
          <g key={c.label} onClick={() => onSelect(isSel ? null : c)} style={{ cursor:'pointer' }} opacity={op}>
            <line x1={x} y1={yS(c.max)} x2={x} y2={yS(c.min)} stroke={c.col} strokeWidth={isSel ? 2 : 1.5} />
            <line x1={x-bW*0.28} y1={yS(c.max)} x2={x+bW*0.28} y2={yS(c.max)} stroke={c.col} strokeWidth={isSel ? 2 : 1.5} />
            <line x1={x-bW*0.28} y1={yS(c.min)} x2={x+bW*0.28} y2={yS(c.min)} stroke={c.col} strokeWidth={isSel ? 2 : 1.5} />
            <rect x={x-bW/2} y={yS(c.q3)} width={bW} height={Math.abs(yS(c.q1)-yS(c.q3))}
              fill={c.col} fillOpacity={isSel ? 0.85 : 0.35} stroke={c.col} strokeWidth={isSel ? 2 : 1.5} rx="2" />
            <line x1={x-bW/2} y1={yS(c.med)} x2={x+bW/2} y2={yS(c.med)} stroke={isSel ? '#fff' : c.col} strokeWidth={isSel ? 2.5 : 2} />
            <text x={x} y={CH-PB+14} fontSize="9.5" fill={isSel ? C.text1 : C.text2} textAnchor="middle" fontWeight={isSel ? '600' : '400'}>{c.label}</text>
            <text x={x} y={CH-PB+26} fontSize="9" fill="#9A9890" textAnchor="middle">{c.cv}</text>
            <text x={x} y={CH-PB+38} fontSize="9" fill="#9A9890" textAnchor="middle">n={c.n}</text>
          </g>
        );
      })}
      <text x={9} y={PT+iH/2} fontSize="9" fill="#9A9890" textAnchor="middle" transform={`rotate(-90,9,${PT+iH/2})`}>Volatility measure (%)</text>
    </svg>
  );
};

const IndexedLineChart = ({ cohorts, selected, onSelect }) => {
  const allVals = cohorts.flatMap(c => c.idx);
  const yMin = Math.min(...allVals)*0.96, yMax = Math.max(...allVals)*1.04;
  const CH = 190, CW = 480, PL = 42, PR = 16, PT = 10, PB = 36;
  const iH = CH-PT-PB, iW = CW-PL-PR;
  const yS = v => PT + iH - ((v-yMin)/(yMax-yMin))*iH;
  const xS = i => PL + (i/(CHART_YEARS.length-1))*iW;
  const ticks = [60,80,100,120,140,160,180].filter(t => t>=yMin && t<=yMax);
  return (
    <svg width="100%" viewBox={`0 0 ${CW} ${CH}`} style={{ display:'block', overflow:'visible' }}>
      {ticks.map(t => (
        <g key={t}>
          <line x1={PL} y1={yS(t)} x2={CW-PR} y2={yS(t)} stroke={t===100 ? C.border : '#E4EEF3'} strokeWidth={t===100 ? 1.5 : 1} strokeDasharray={t===100 ? '4,3' : 'none'} />
          <text x={PL-4} y={yS(t)+3.5} fontSize="9" fill="#9A9890" textAnchor="end">{t}</text>
        </g>
      ))}
      {cohorts.map(c => {
        const isSel = selected?.label === c.label;
        const pts = c.idx.map((v,i) => `${xS(i)},${yS(v)}`).join(' ');
        return (
          <g key={c.label} onClick={() => onSelect(isSel ? null : c)} style={{ cursor:'pointer' }}>
            <polyline fill="none" stroke={c.col} strokeWidth={isSel ? 2.5 : 1.5} strokeOpacity={selected && !isSel ? 0.2 : 1} points={pts} />
            {c.idx.map((v,i) => (
              <circle key={i} cx={xS(i)} cy={yS(v)} r={isSel ? 4 : 2.5}
                fill={isSel ? c.col : '#fff'} stroke={c.col}
                strokeWidth={isSel ? 0 : 1.5}
                strokeOpacity={selected && !isSel ? 0.2 : 1}
                fillOpacity={selected && !isSel ? 0.2 : 1} />
            ))}
          </g>
        );
      })}
      {CHART_YEARS.map((y,i) => (
        <text key={y} x={xS(i)} y={CH-PB+14} fontSize="10" fill="#9A9890" textAnchor="middle">{y}</text>
      ))}
      <text x={9} y={PT+iH/2} fontSize="9" fill="#9A9890" textAnchor="middle" transform={`rotate(-90,9,${PT+iH/2})`}>Indexed (2019 = 100)</text>
    </svg>
  );
};

const CohortMemberPanel = ({ cohort, view }) => (
  <div style={{ background: C.surface, border:`1px solid ${C.border}`, borderRadius:8, overflow:'hidden' }}>
    <div style={{ padding:'12px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
      <div>
        <div style={{ fontWeight:700, fontSize:13 }}>{cohort ? `${cohort.label} — Members` : 'Select a cohort'}</div>
        {cohort && <div style={{ fontSize:11, color: C.text3, marginTop:1 }}>{cohort.n} organizations · {cohort.cv}</div>}
      </div>
      {cohort && <Btn style={{ fontSize:11 }}>Export ↓</Btn>}
    </div>
    <div style={{ minHeight:180, maxHeight:300, overflowY:'auto' }}>
      {!cohort
        ? <div style={{ padding:'48px 20px', color: C.text3, fontSize:12, textAlign:'center' }}>← Click a cohort to view member organizations</div>
        : <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
            <thead><tr style={{ background: C.surfAlt }}>
              <th style={{ padding:'7px 14px', textAlign:'left', fontWeight:500, color: C.text2, borderBottom:`1px solid ${C.border}`, fontSize:11 }}>Organization</th>
              <th style={{ padding:'7px 14px', textAlign:'right', fontWeight:500, color: C.text2, borderBottom:`1px solid ${C.border}`, fontSize:11 }}>{view === 'vol' ? 'CV' : 'CAGR'}</th>
              <th style={{ padding:'7px 14px', textAlign:'right', fontWeight:500, color: C.text2, borderBottom:`1px solid ${C.border}`, fontSize:11 }}>Revenue 2023</th>
            </tr></thead>
            <tbody>
              {ORGS.slice(0,4).map((o,i) => (
                <tr key={o.ein} style={{ borderBottom:`1px solid ${C.border}` }}>
                  <td style={{ padding:'8px 14px' }}>
                    <div style={{ fontWeight:500 }}>{o.name}</div>
                    <div style={{ fontSize:10, color: C.text3 }}>{o.ein}</div>
                  </td>
                  <td style={{ padding:'8px 14px', textAlign:'right', color: cohort.col, fontWeight:700 }}>{view === 'vol' ? `${(5+i*3.8).toFixed(1)}%` : `${(1.8+i*2.4).toFixed(1)}%`}</td>
                  <td style={{ padding:'8px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums' }}>{fmt(ALL_FIN[o.ein]?.[2023]?.totalRevenue)}</td>
                </tr>
              ))}
            </tbody>
          </table>
      }
    </div>
  </div>
);

const Visualization = () => {
  const [view, setView]         = useState('trend');
  const [cohort, setCohort]     = useState(null);
  const [selOrgs, setSelOrgs]   = useState(['13-5562394','04-2103524','06-0646973']);
  const [metric, setMetric]     = useState('totalRevenue');
  const [periodStart, setPeriodStart] = useState(2019);
  const [periodEnd,   setPeriodEnd]   = useState(2023);
  const ALL_YEARS = [2014,2015,2016,2017,2018,2019,2020,2021,2022,2023];
  const activePeriod = ALL_YEARS.filter(y => y >= periodStart && y <= periodEnd);
  const W = 620, PL = 36, PR = 20;
  const xPos = i => PL + (i/(activePeriod.length-1))*(W-PL-PR);

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh' }}>
      {/* Tab bar */}
      <div style={{ padding:'12px 20px', background: C.surface, borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:10 }}>
        <h1 style={{ fontSize:15, fontWeight:700, marginRight:6 }}>Visualization</h1>
        {[{id:'trend',l:'A — Trend'},{id:'vol',l:'B — Volatility'},{id:'growth',l:'C — Growth'}].map(v => (
          <button key={v.id} onClick={() => { setView(v.id); setCohort(null); }}
            style={{ padding:'5px 14px', borderRadius:4, border:`1px solid ${view===v.id ? C.accent : C.border}`, background: view===v.id ? C.accentLt : 'transparent', color: view===v.id ? C.accent : C.text2, fontSize:12, fontWeight:500, cursor:'pointer', fontFamily:'inherit' }}>{v.l}</button>
        ))}
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:11, color: C.text3 }}>Period:</span>
          <select value={periodStart} onChange={e => setPeriodStart(+e.target.value)}
            style={{ border:`1px solid ${C.border}`, borderRadius:4, padding:'4px 8px', fontSize:11, outline:'none', background: C.surface, fontFamily:'inherit' }}>
            {ALL_YEARS.filter(y => y < periodEnd).map(y => <option key={y} value={y}>{y}</option>)}
          </select>
          <span style={{ fontSize:11, color: C.text3 }}>→</span>
          <select value={periodEnd} onChange={e => setPeriodEnd(+e.target.value)}
            style={{ border:`1px solid ${C.border}`, borderRadius:4, padding:'4px 8px', fontSize:11, outline:'none', background: C.surface, fontFamily:'inherit' }}>
            {ALL_YEARS.filter(y => y > periodStart).map(y => <option key={y} value={y}>{y}</option>)}
          </select>
          <Btn style={{ fontSize:11 }}>Export ↓</Btn>
        </div>
      </div>

      <div style={{ flex:1, overflow:'auto', padding:20 }}>

        {/* ── A: Multi-institution trend ── */}
        {view === 'trend' && (
          <div style={{ display:'flex', gap:16, alignItems:'flex-start' }}>
            <div style={{ width:204, background: C.surface, border:`1px solid ${C.border}`, borderRadius:8, padding:14, flexShrink:0 }}>
              <SecLabel>Institutions (max 10)</SecLabel>
              {ORGS.map(o => (
                <label key={o.ein} style={{ display:'flex', alignItems:'flex-start', gap:8, marginBottom:7, cursor:'pointer', fontSize:12 }}>
                  <input type="checkbox" checked={selOrgs.includes(o.ein)} style={{ marginTop:2, flexShrink:0 }}
                    onChange={e => e.target.checked ? setSelOrgs(s => [...s, o.ein].slice(0,10)) : setSelOrgs(s => s.filter(x => x !== o.ein))} />
                  <span style={{ color: C.text1, lineHeight:1.35 }}>{o.name}</span>
                </label>
              ))}
              <div style={{ marginTop:14, paddingTop:14, borderTop:`1px solid ${C.border}` }}>
                <SecLabel>Metric</SecLabel>
                <select value={metric} onChange={e => setMetric(e.target.value)} style={{ width:'100%', border:`1px solid ${C.border}`, borderRadius:4, padding:'5px 8px', fontSize:11, outline:'none', background: C.surface, fontFamily:'inherit' }}>
                  {[['totalRevenue','Total Revenue'],['totalExpenses','Total Expenses'],['netIncome','Net Income'],['uc1','Unrestr. Cash — M1'],['uc2','Unrestr. Cash — M2'],['uc3','Unrestr. Cash — M3']].map(([v,l]) => <option key={v} value={v}>{l}</option>)}
                </select>
              </div>
            </div>
            <div style={{ flex:1, background: C.surface, border:`1px solid ${C.border}`, borderRadius:8, overflow:'hidden' }}>
              <div style={{ padding:'11px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', gap:16, flexWrap:'wrap', alignItems:'center' }}>
                {selOrgs.map((ein, idx) => {
                  const o = ORGS.find(x => x.ein === ein);
                  return <span key={ein} style={{ display:'flex', alignItems:'center', gap:5, fontSize:11, color: C.text2 }}>
                    <svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke={C.chart[idx % C.chart.length]} strokeWidth="2.5" /></svg>
                    {o?.name.split(' ').slice(0,3).join(' ')}
                  </span>;
                })}
              </div>
              <div style={{ padding:'16px 20px 20px' }}>
                <svg width="100%" viewBox={`0 0 ${W} 180`} style={{ overflow:'visible', display:'block' }}>
                  {[0.25,0.5,0.75,1].map((p,i) => <line key={i} x1={PL} y1={20+p*140} x2={W-PR} y2={20+p*140} stroke="#EDEAE6" strokeWidth="1" />)}
                  {selOrgs.map((ein, idx) => {
                    const vals = CHART_YEARS.map(y => ALL_FIN[ein]?.[y]?.[metric] || 0);
                    const mx = Math.max(...vals.map(Math.abs), 1);
                    const col = C.chart[idx % C.chart.length];
                    return (
                      <g key={ein}>
                        <polyline fill="none" stroke={col} strokeWidth="1.5" points={vals.map((v,i) => `${xPos(i)},${155-(Math.abs(v)/mx)*130}`).join(' ')} />
                        {vals.map((v,i) => <circle key={i} cx={xPos(i)} cy={155-(Math.abs(v)/mx)*130} r="3" fill={col} />)}
                      </g>
                    );
                  })}
                  {CHART_YEARS.map((y,i) => <text key={y} x={xPos(i)} y={173} fontSize="10" fill={C.text3} textAnchor="middle">{y}</text>)}
                </svg>
              </div>
            </div>
          </div>
        )}

        {/* ── B: Volatility (box-and-whisker) ── */}
        {view === 'vol' && (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, alignItems:'start' }}>
            <div style={{ background: C.surface, border:`1px solid ${C.border}`, borderRadius:8, overflow:'hidden' }}>
              <div style={{ padding:'12px 16px', borderBottom:`1px solid ${C.border}` }}>
                <div style={{ fontWeight:700, fontSize:13 }}>Revenue Volatility Distribution</div>
                <div style={{ fontSize:11, color: C.text3, marginTop:2 }}>{periodStart}–{periodEnd} window · formula TBD · click a box to view members</div>
              </div>
              <div style={{ padding:'16px 20px 20px' }}>
                <BoxWhiskerChart cohorts={VOL_COHORTS} selected={cohort} onSelect={setCohort} period={activePeriod} />
              </div>
            </div>
            <CohortMemberPanel cohort={cohort} view="vol" />
          </div>
        )}

        {/* ── C: Growth (indexed line chart) ── */}
        {view === 'growth' && (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, alignItems:'start' }}>
            <div style={{ background: C.surface, border:`1px solid ${C.border}`, borderRadius:8, overflow:'hidden' }}>
              <div style={{ padding:'12px 16px', borderBottom:`1px solid ${C.border}` }}>
                <div style={{ fontWeight:700, fontSize:13 }}>Revenue Growth Cohorts</div>
                <div style={{ fontSize:11, color: C.text3, marginTop:2 }}>Indexed to 100 at start of period ({periodStart}) · click a line to view members</div>
              </div>
              <div style={{ padding:'16px 20px 12px' }}>
                <IndexedLineChart cohorts={GROWTH_COHORTS} selected={cohort} onSelect={setCohort} period={activePeriod} />
              </div>
              <div style={{ padding:'0 20px 16px', display:'flex', gap:14, flexWrap:'wrap' }}>
                {GROWTH_COHORTS.map(c => (
                  <span key={c.label} onClick={() => setCohort(cohort?.label === c.label ? null : c)}
                    style={{ display:'flex', alignItems:'center', gap:5, fontSize:11, cursor:'pointer', opacity: cohort && cohort.label !== c.label ? 0.35 : 1, fontWeight: cohort?.label === c.label ? 600 : 400, color: C.text2 }}>
                    <svg width="16" height="8"><line x1="0" y1="4" x2="16" y2="4" stroke={c.col} strokeWidth="2.5" /></svg>
                    {c.label}
                  </span>
                ))}
              </div>
            </div>
            <CohortMemberPanel cohort={cohort} view="growth" />
          </div>
        )}

      </div>
    </div>
  );
};


// ─── 5. Cohorts ───────────────────────────────────────────────────────────────
const Cohorts = () => {
  const [cohorts] = useState([
    { name:'Major Museums',        col:'#2B5838', members:['13-5562394','13-2655607'] },
    { name:'Research Universities', col:'#3D5F8A', members:['04-2103524','06-0646973'] },
  ]);
  const [active, setActive] = useState(0);
  const coh = cohorts[active];

  return (
    <div style={{ display:'flex', height:'100vh' }}>
      <div style={{ width:200, borderRight:`1px solid ${C.border}`, background: C.surface, flexShrink:0, display:'flex', flexDirection:'column' }}>
        <div style={{ padding:14, borderBottom:`1px solid ${C.border}` }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:10 }}>Cohorts</div>
          <Btn variant="primary" style={{ width:'100%', justifyContent:'center', fontSize:12 }}>+ New Cohort</Btn>
        </div>
        <div style={{ flex:1, overflowY:'auto', padding:8 }}>
          {cohorts.map((c, i) => (
            <div key={c.name} onClick={() => setActive(i)} style={{ padding:'10px 12px', borderRadius:6, cursor:'pointer', marginBottom:4, background: active === i ? C.accentLt : 'transparent', border:`1px solid ${active === i ? C.accentBdr : 'transparent'}` }}>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <span style={{ width:8, height:8, borderRadius:'50%', background: c.col, flexShrink:0 }}></span>
                <span style={{ fontWeight:500, fontSize:12 }}>{c.name}</span>
              </div>
              <div style={{ fontSize:11, color: C.text3, marginTop:2, paddingLeft:16 }}>{c.members.length} members</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ flex:1, display:'flex', flexDirection:'column' }}>
        <div style={{ padding:'14px 20px', borderBottom:`1px solid ${C.border}`, background: C.surface, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div>
            <h1 style={{ fontSize:15, fontWeight:700 }}>{coh.name}</h1>
            <p style={{ fontSize:12, color: C.text3, marginTop:2 }}>{coh.members.length} organizations</p>
          </div>
          <div style={{ display:'flex', gap:8 }}>
            <Btn style={{ fontSize:11 }}>Rename</Btn>
            <Btn style={{ fontSize:11 }}>Export ↓</Btn>
            <Btn style={{ fontSize:11 }}>View in Main Data →</Btn>
          </div>
        </div>
        <div style={{ flex:1, overflow:'auto', padding:20 }}>
          <div style={{ background: C.surface, border:`1px solid ${C.border}`, borderRadius:8, overflow:'hidden', marginBottom:14 }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
              <thead><tr style={{ background: C.surfAlt }}>
                {['Organization','EIN','Sector','Revenue (2023)','Net Assets (2023)',''].map(h => (
                  <th key={h} style={{ padding:'8px 14px', textAlign: h.includes('Revenue') || h.includes('Assets') ? 'right' : 'left', fontWeight:500, color: C.text2, borderBottom:`1px solid ${C.border}`, fontSize:11 }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {coh.members.map(ein => {
                  const o = ORGS.find(x => x.ein === ein);
                  const f = ALL_FIN[ein]?.[2023] || MET_FIN[2023];
                  return (
                    <tr key={ein} style={{ borderBottom:`1px solid ${C.border}` }}>
                      <td style={{ padding:'9px 14px', fontWeight:500 }}>{o?.name}</td>
                      <td style={{ padding:'9px 14px', color: C.text2, fontSize:11 }}>{ein}</td>
                      <td style={{ padding:'9px 14px', color: C.text2 }}>{o?.sector}</td>
                      <td style={{ padding:'9px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums' }}>{fmt(f?.totalRevenue)}</td>
                      <td style={{ padding:'9px 14px', textAlign:'right', fontVariantNumeric:'tabular-nums' }}>{fmt(f?.totalNA)}</td>
                      <td style={{ padding:'9px 14px' }}><button style={{ background:'none', border:'none', color: C.err, fontSize:11, cursor:'pointer', fontFamily:'inherit' }}>Remove</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{ background: C.surfAlt, border:`1px dashed ${C.border}`, borderRadius:8, padding:20, textAlign:'center', color: C.text3, fontSize:12, lineHeight:1.7 }}>
            + Add institutions — select rows in Main Data and click "Tag Selected",<br />or drag EINs here
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── App Shell ────────────────────────────────────────────────────────────────
const App = () => {
  const [section, setSection] = useState('overview');
  const [drillEin, setDrillEin]   = useState(null);
  const [drillYear, setDrillYear] = useState(null);

  const drillIn = (ein, year) => { setDrillEin(ein); setDrillYear(year); setSection('institution'); };

  return (
    <div style={{ display:'flex', minHeight:'100vh', overflow:'hidden' }}>
      <LeftNav active={section} setActive={setSection} />
      <div style={{ marginLeft:196, width:'calc(100vw - 196px)', minHeight:'100vh', background: section === 'overview' ? C.bg : C.surface, overflow:'hidden' }}>
        {section === 'overview'    && <Overview setActive={setSection} setDrill={drillIn} />}
        {section === 'main-data'   && <MainData onDrill={drillIn} />}
        {section === 'institution' && <InstAnalysis key={drillEin || 'default'} initialEin={drillEin} initialYear={drillYear} />}
        {section === 'viz'         && <Visualization />}
        {section === 'cohorts'     && <Cohorts />}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
